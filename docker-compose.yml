services:
  postgres:
    image: postgres:16-alpine
    container_name: shivaay-library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shivaay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shivaay_local_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-shivaay_library}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shivaay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shivaay} -d ${POSTGRES_DB:-shivaay_library}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shivaay_postgres_data:
